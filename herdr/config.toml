onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# ctrl+h/j/k/l (focus) and alt+h/j/k/l (resize) from any pane, unless the
# focused pane runs (n)vim, in which case the chord is forwarded so nvim can act
# on its own splits first (see plugins/smart-nav and nvim/lua/config/herdr_nav.lua).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "johnpgr.smart-nav.focus-left"
description = "focus pane left (vim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "johnpgr.smart-nav.focus-down"
description = "focus pane down (vim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "johnpgr.smart-nav.focus-up"
description = "focus pane up (vim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "johnpgr.smart-nav.focus-right"
description = "focus pane right (vim-aware)"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "johnpgr.smart-nav.resize-left"
description = "resize pane left (vim-aware)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "johnpgr.smart-nav.resize-down"
description = "resize pane down (vim-aware)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "johnpgr.smart-nav.resize-up"
description = "resize pane up (vim-aware)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "johnpgr.smart-nav.resize-right"
description = "resize pane right (vim-aware)"

[ui]
# On WSL, Herdr's default "auto" policy draws a block cursor itself.  Use
# Windows Terminal's native cursor so Neovim can request its insert-mode bar.
host_cursor = "native"

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"
