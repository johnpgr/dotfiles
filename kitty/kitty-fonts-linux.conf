# Fonts used on Linux. Loaded from kitty.conf via:
#   include kitty-fonts-${KITTY_OS}.conf
# If Source Code Pro is not installed, kitty falls back to the default
# monospace font.

font_family      family="Source Code Pro" style="Regular"
bold_font        family="Source Code Pro" style="Regular"
italic_font      family="Source Code Pro" style="Italic"
bold_italic_font family="Source Code Pro" style="Italic"
